[pytest]
# BIS405 Group 3 — Customer Churn Prediction System
# Sprint 5 — Test Suite Configuration

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show each test name and result clearly
addopts =
    --tb=short
    --strict-markers
    -q

# Custom markers for each stage
markers =
    stage1: Stage 1 — Raw data loading tests
    stage2: Stage 2 — Preprocessing pipeline tests
    stage3: Stage 3 — Model inference tests
    stage4: Stage 4 — End-to-end prediction tests
    smoke:  Quick smoke tests (runs in < 10 seconds)
    slow:   Tests that load the full 50k dataset (takes longer)
